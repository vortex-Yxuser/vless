name: Android Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SING_BOX_VERSION: "1.13.12"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Build libbox.aar
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"

          export GOBIN="${HOME}/go/bin"
          export PATH="${GOBIN}:${PATH}"

          mkdir -p "${GOBIN}"

          echo "Go:"
          go version

          echo "======================================"
          echo "Checking sing-box"
          echo "======================================"

          if [ ! -d "sing-box" ]; then
            git clone --depth 1 \
              --branch "v${SING_BOX_VERSION}" \
              https://github.com/SagerNet/sing-box.git \
              sing-box
          fi

          cd sing-box

          echo "sing-box:"
          pwd

          git describe --tags --always || true

          echo "======================================"
          echo "Installing gomobile"
          echo "======================================"

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          command -v gomobile
          command -v gobind

          gomobile version || true

          echo "======================================"
          echo "Android NDK"
          echo "======================================"

          test -d "${ANDROID_NDK_HOME}"

          echo "${ANDROID_NDK_HOME}"

          echo "======================================"
          echo "Building libbox.aar"
          echo "======================================"

          go run ./cmd/internal/build_libbox -target android

          echo "======================================"
          echo "Searching AAR"
          echo "======================================"

          find . -type f \
            \( -name "libbox.aar" -o -name "libbox-legacy.aar" \) \
            -print

          AAR=""

          if [ -f "./libbox.aar" ]; then
            AAR="./libbox.aar"
          elif [ -f "./libbox-legacy.aar" ]; then
            AAR="./libbox-legacy.aar"
          else
            AAR="$(find . -type f -name "libbox.aar" -print -quit)"
          fi

          if [ -z "${AAR}" ]; then
            echo "ERROR: libbox.aar not found"
            exit 1
          fi

          echo "Using AAR: ${AAR}"

          mkdir -p ../app/libs

          cp "${AAR}" ../app/libs/libbox.aar

          test -s ../app/libs/libbox.aar

          echo "Installed:"
          ls -lh ../app/libs/libbox.aar

      - name: Verify Android project
        run: |
          set -euxo pipefail

          echo "Root:"
          pwd

          echo "Files:"
          ls -la

          echo "AAR:"
          ls -lh ./app/libs/libbox.aar

          test -f ./app/libs/libbox.aar
          test -s ./app/libs/libbox.aar

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./gradlew

          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
