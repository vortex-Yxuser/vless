name: Android Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SING_BOX_VERSION: "1.13.12"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          set -euxo pipefail

          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Check Android environment
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"

          test -d "${ANDROID_NDK_HOME}"

          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          go version
          java -version
          "${ANDROID_NDK_HOME}/ndk-build" --version || true

      - name: Build libbox.aar
        shell: bash
        run: |
          set -euxo pipefail

          cd sing-box

          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"

          mkdir -p ../app/libs

          echo "======================================"
          echo "Install gomobile"
          echo "======================================"

          rm -f "$(go env GOPATH)/bin/gomobile"
          rm -f "$(go env GOPATH)/bin/gobind"

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

          export PATH="$(go env GOPATH)/bin:${PATH}"

          echo "PATH=${PATH}"

          echo "gomobile:"
          command -v gomobile
          gomobile version || true

          echo "gobind:"
          command -v gobind
          gobind -h >/dev/null

          echo "======================================"
          echo "Build libbox.aar"
          echo "======================================"

          rm -f ./libbox.aar
          rm -f ../app/libs/libbox.aar

          go run ./cmd/internal/build_libbox -target android

          echo "======================================"
          echo "Generated files"
          echo "======================================"

          find . -type f \
            \( -name "libbox.aar" -o -name "libbox-legacy.aar" \) \
            -print

          test -f ./libbox.aar
          test -s ./libbox.aar

          cp ./libbox.aar ../app/libs/libbox.aar

          test -f ../app/libs/libbox.aar
          test -s ../app/libs/libbox.aar

          echo "======================================"
          echo "SUCCESS"
          echo "======================================"

          ls -lh ../app/libs/libbox.aar

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          test -s app/libs/libbox.aar

          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
