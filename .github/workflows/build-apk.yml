name: Build SZXVPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    env:
      SING_BOX_VERSION: "1.13.12"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Download sing-box
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "v${SING_BOX_VERSION}" \
            https://github.com/SagerNet/sing-box.git \
            sing-box

          cd sing-box
          git describe --tags --always

      - name: Prepare app libs
        shell: bash
        run: |
          mkdir -p app/libs
          ls -la app

      - name: Build Android project
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts not found"
            exit 1
          fi

          echo "Android project found."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: szxvpn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
