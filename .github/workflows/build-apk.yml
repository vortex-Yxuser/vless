name: Build SZXVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      SING_BOX_VERSION: "1.13.12"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Clone sing-box
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "v${SING_BOX_VERSION}" \
            https://github.com/SagerNet/sing-box.git \
            sing-box

          cd sing-box

          git describe --tags --always

      - name: Build libbox.aar
        shell: bash
        run: |
          set -euxo pipefail

          cd sing-box

          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"

          mkdir -p ../app/libs

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"

          go version

          # Install the gomobile tools required by sing-box.
          go run ./cmd/internal/build_libbox -target android

          echo "Searching for generated AAR..."

          find . -type f \
            \( -name "libbox.aar" -o -name "libbox-legacy.aar" \) \
            -print

          test -f libbox.aar

          cp libbox.aar ../app/libs/libbox.aar

          test -s ../app/libs/libbox.aar

          echo "libbox.aar successfully installed:"
          ls -lh ../app/libs/libbox.aar

      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail

          test -f app/libs/libbox.aar

          ls -lh app/libs/libbox.aar

          unzip -t app/libs/libbox.aar >/dev/null

          echo "AAR verification OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          gradle \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          find app/build/outputs/apk -type f -name "*.apk" -print

          test -n "$(find app/build/outputs/apk -type f -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: szxvpn-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
